services:
  - type: web
    name: wangs-backend
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_wangs_data"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wangs-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,wangs.in,api.wangs.in"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  - name: wangs-postgres
    databaseName: wangs_db
    user: wangs_admin
    region: singapore
    plan: standard
