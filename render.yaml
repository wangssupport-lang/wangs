services:
  - type: web
    name: wangs-backend
    env: python
    region: singapore
    plan: standard
    rootDir: wangs_backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py seed_wangs_data && python manage.py ensure_admin && python manage.py collectstatic --noinput"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wangs-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,wangs.in,www.wangs.in,api.wangs.in"
      - key: DJANGO_ADMIN_USERNAME
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: wangssupport@gmail.com
      - key: EMAIL_HOST_PASSWORD
        value: xphhqfosryvzyscc
      - key: DEFAULT_FROM_EMAIL
        value: wangssupport@gmail.com
      - key: MAIL_RELAY_URL
        value: https://wangs.in/api/mail-relay
      - key: MAIL_RELAY_SECRET
        value: wangs-internal-mail-secret-key-2026

databases:
  - name: wangs-postgres
    databaseName: wangs_db
    user: wangs_admin
    region: singapore
    plan: standard
