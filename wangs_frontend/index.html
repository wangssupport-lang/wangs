    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      (function() {
        var host = window.location.hostname;
        var isLocal = host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local');
        // Enforce HTTPS
        if (!isLocal && window.location.protocol === 'http:') {
          window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
        }
        // Normalize www.wangs.in to wangs.in
        if (host === 'www.wangs.in') {
          window.location.replace('https://wangs.in' + window.location.pathname + window.location.search + window.location.hash);
        }
      })();
    </script>
    <title>Wangs — Artisanal Food & Handcrafted Pickle Marketplace · wangs.in</title>
